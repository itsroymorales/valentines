<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Will you be my Valentine?</title>

    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg1: #D3D3FF;
            --bg2: #D3D3FF;
            --card: #ffffffcc;
            --yes: #ff3b7a;
            --yesHover: #ff1f68;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, var(--bg2), var(--bg1));
            font-family: system-ui, sans-serif;
            overflow: auto;
            padding: 16px;
        }

        /* FULL-SCREEN CONFETTI CANVAS */
        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .card {
            width: min(720px, 92vw);
            padding: 26px 22px;
            background: var(--card);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 18px 60px rgba(0, 0, 0, .15);
        }

        .art {
            width: min(260px, 80vw);
            margin: 0 auto 10px;
            display: block;
            filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .12));
        }

        h1 {
            font-size: clamp(26px, 4vw, 44px);
            margin: 12px 0 18px;
        }

        .button-zone {
            position: relative;
            width: min(520px, 92%);
            height: 150px;
            margin: 0 auto;
            touch-action: none;
        }

        button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .14);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform .12s ease, background .12s ease;
        }

        #yesBtn {
            left: 18%;
            background: var(--yes);
            color: #fff;
        }

        #yesBtn:hover {
            background: var(--yesHover);
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 12px 28px rgba(255, 59, 122, 0.4);
        }

        #noBtn {
            left: 62%;
            background: #e5e7eb;
            color: #111827;
        }

        #noBtn:hover {
            background: #d1d5db;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
        }

        .hint {
            margin-top: 10px;
            font-size: 13px;
            opacity: .7;
        }

        .result {
            display: none;
            margin-top: 18px;
            animation: pop .35s ease;
            padding: 0 16px;
        }

        .result h2 {
            font-size: clamp(30px, 4.5vw, 46px);
            margin: 10px 0;
        }

        .dinner {
            width: min(380px, 90vw);
            max-width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
            object-fit: contain;
        }

        @media (max-width: 600px) {
            .dinner {
                width: min(280px, 85vw);
            }

            .result {
                margin-top: 12px;
                padding: 0 8px;
            }

            .result h2 {
                font-size: clamp(24px, 6vw, 36px);
            }
        }

        @keyframes pop {
            from {
                transform: scale(.96);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <canvas id="confettiCanvas"></canvas>

    <main class="card">
        <!-- ANIMAL WITH HEART -->
        <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">

                <radialGradient id="snout" cx="0.5" cy="0.3">
                    <stop offset="0" stop-color="#f0dcc8" />

                <linearGradient id="heart" x1="0" x2="1">

                    C116 130 118 145 122 158
                    C126 170 135 182 145 190
                    C155 198 168 204 180 207
                    C184 208 187 208 190 208
                    C193 208 196 208 200 207
                    C212 204 225 198 235 190
                    C245 182 254 170 258 158
                    C262 145 264 130 264 115
                    C264 105 264 95 262 85
                    C260 72 252 62 242 55
                    C228 45 210 40 190 40Z

            <!-- Left Ear -->
            <ellipse cx="120" cy="100" rx="22" ry="35" fill="#b8885a" transform="rotate(-40 120 100)" />

            <circle cx="115" cy="88" r="10" fill="#c9995e" opacity="0.7" />

            <ellipse cx="260" cy="100" rx="22" ry="35" fill="#b8885a" transform="rotate(40 260 100)" />

            <circle cx="265" cy="88" r="10" fill="#c9995e" opacity="0.7" />
            <circle cx="256" cy="93" r="8" fill="#b8885a" opacity="0.6" />

            <!-- Snout -->
            <ellipse cx="190" cy="150" rx="30" ry="32" fill="url(#snout)" />

            <!-- Left Eye White-->
            <ellipse cx="163" cy="115" rx="13" ry="15" fill="white" />

            <!-- Left Eye Pupil -->
            <ellipse cx="165" cy="117" rx="9" ry="11" fill="#2C2C2C" />

            <!-- Left Eye highlight -->
            <ellipse cx="162" cy="113" r="3" fill="#white" opacity="0.9" />


            <!-- Right Eye White-->
            <ellipse cx="217" cy="115" rx="13" ry="15" fill="white" />

            <!-- Right Eye Pupil -->
            <ellipse cx="215" cy="117" rx="9" ry="11" fill="#2c2c2c" />

            <!-- Right Eye highlight -->
            <ellipse cx="212" cy="113" r="3" fill="#white" opacity="0.9" />

            <!-- NOSE -->
            <ellipse cx="190" cy="155" rx="15" ry="12" fill="#2c2c2c" />

            <!-- SMILE -->
            <path d="M190 160 Q185 166 180 168" stroke="#2c2c2c" stroke-width="2.5" fill="none"
                stroke-linecap="round" />
            <path d="M190 160 Q195 166 200 168" stroke="#2c2c2c" stroke-width="2.5" fill="none"
                stroke-linecap="round" />

            <!-- Tounge -->
            <ellipse cx="190" cy="173" rx="8" ry="6" fill="#ff8fa3" opacity="0.8" />

        </svg>

        <p p style="margin: 12px 0 6px; font-size: 22px; opacity: 0.85; font-weight: 500;"> Hi Carla Faye </p>
        <h2 style="font-size: clamp(32px, 5vw, 52px); margin: 14px 0 20px;">Will you be my valentine?</h2>
        <p p style="margin: 6px 0 12px; font-size: 22px; opacity: 0.85; font-weight: 500;"> Roy </p>

        <section class="button-zone" id="zone">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </section>

        <!-- HINT -->
        <div class="hint" id="hint">“No?” Give me a shot 😈</div>

        <section class="result" id="result">
            <h2>YAY!🥰</h2>
            <img class="dinner"
                src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExcjluaWNiMzBrbDVzMWU3ZjE0bm13Zm1zcXp3OWliNmpjcTU4cmRpaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/74hxSB8JCnxwQ/giphy.gif"
                alt="Dinner" />
        </section>
    </main>

    <script>
        const zone = document.getElementById("zone");
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const result = document.getElementById("result");
        const hint = document.getElementById("hint");

        /* ---------- CONFETTI ---------- */
        const confettiCanvas = document.getElementById("confettiCanvas");

        function resizeConfettiCanvas() {
            const dpr = Math.max(1, window.devicePixelRatio || 1);
            confettiCanvas.width = Math.floor(window.innerWidth * dpr);
            confettiCanvas.height = Math.floor(window.innerHeight * dpr);
            confettiCanvas.style.width = "100vw";
            confettiCanvas.style.height = "100vh";
        }

        resizeConfettiCanvas();
        window.addEventListener("resize", resizeConfettiCanvas);
        window.addEventListener("orientationchange", () => setTimeout(resizeConfettiCanvas, 150));

        const confettiInstance = confetti.create(confettiCanvas, {
            resize: false,
            useWorker: true
        });

        function fullScreenConfetti() {
            const end = Date.now() + 1600;

            (function frame() {
                confettiInstance({
                    particleCount: 12,
                    spread: 90,
                    startVelocity: 45,
                    ticks: 180,
                    origin: { x: Math.random(), y: Math.random() * 0.3 }
                });
                if (Date.now() < end) requestAnimationFrame(frame);
            })();

            setTimeout(() => {
                confettiInstance({
                    particleCount: 300,
                    spread: 140,
                    startVelocity: 60,
                    ticks: 220,
                    origin: { x: 0.5, y: 0.55 }
                });
            }, 300);
        }

        /* ---------- YES BUTTON GROWS ---------- */
        let yesScale = 1;
        function growYes() {
            yesScale = Math.min(2.2, yesScale + 0.1);
            yesBtn.style.transform = `translateY(-50%) scale(${yesScale})`;
        }

        /* ---------- NO BUTTON RUNS AWAY ---------- */
        function clamp(n, min, max) {
            return Math.max(min, Math.min(max, n));
        }

        function moveNo(px, py) {
            const z = zone.getBoundingClientRect();
            const b = noBtn.getBoundingClientRect();

            let dx = (b.left + b.width / 2) - px;
            let dy = (b.top + b.height / 2) - py;
            let mag = Math.hypot(dx, dy) || 1;
            dx /= mag;
            dy /= mag;

            let newLeft = (b.left - z.left) + dx * 150;
            let newTop = (b.top - z.top) + dy * 150;

            newLeft = clamp(newLeft, 0, z.width - b.width);
            newTop = clamp(newTop, 0, z.height - b.height);

            noBtn.style.left = newLeft + "px";
            noBtn.style.top = newTop + "px";
            noBtn.style.transform = "none";

            growYes();
        }

        zone.addEventListener("pointermove", e => {
            const b = noBtn.getBoundingClientRect();
            const d = Math.hypot(
                (b.left + b.width / 2) - e.clientX,
                (b.top + b.height / 2) - e.clientY
            );
            if (d < 140) moveNo(e.clientX, e.clientY);
        });

        // Mobile: move button on touchstart
        noBtn.addEventListener("touchstart", e => {
            e.preventDefault();
            const touch = e.touches[0];
            moveNo(touch.clientX, touch.clientY);
        });

        // Mobile: move on touch near the button in the zone
        zone.addEventListener("touchstart", e => {
            const touch = e.touches[0];
            const b = noBtn.getBoundingClientRect();
            const d = Math.hypot(
                (b.left + b.width / 2) - touch.clientX,
                (b.top + b.height / 2) - touch.clientY
            );
            if (d < 80) {
                e.preventDefault();
                moveNo(touchh.clientX, touch.clientY);
            }


        });


        noBtn.addEventListener("click", e => e.preventDefault());

        /* ---------- YES CLICK ---------- */
        yesBtn.addEventListener("click", () => {
            zone.style.display = "none";
            hint.style.display = "none";     // HIDE THE HINT
            result.style.display = "block";
            resizeConfettiCanvas();
            fullScreenConfetti();
        });
    </script>
</body>

</html>
